version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: portal_negociacao_db
    environment:
      POSTGRES_DB: portal_negociacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portal_negociacao"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: portal_negociacao_api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/portal_negociacao
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

volumes:
  postgres_data:
